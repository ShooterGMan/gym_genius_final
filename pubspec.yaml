name: GYMGenius
description: A premium fitness tracking application
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.18.0
  image_picker: ^1.0.7
  wakelock_plus: ^1.1.4
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  archive: ^4.0.9
  file_picker: ^12.3.0
  fl_chart: ^1.2.0
  share_plus: ^13.2.0
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  

flutter:
  uses-material-design: true

  
  assets:
    - assets/exercises.json
    - assets/popular_workouts.json
    - assets/images/
    - assets/placeholders/
    - assets/workout_covers/categories/
    - assets/workout_covers/workouts/